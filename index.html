
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <title>Panic Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      min-height: 100vh;
      padding: 8px;
      padding-top: env(safe-area-inset-top, 16px);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      margin-top: 40px;
    }
    .header h1 {
      font-size: 22px;
      color: #4ecca3;
      margin-bottom: 4px;
    }
    .header .version {
      font-size: 12px;
      color: #888;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin-top: 8px;
      background: #2a2a4a;
      color: #4ecca3;
    }
    .status.offline { background: #4a2a2a; color: #ff6b6b; }
    textarea {
      width: 100%;
      height: 180px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 10px 8px;
      color: #eaeaea;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #4ecca3; }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-analyze {
      background: #4ecca3;
      color: #1a1a2e;
    }
    .btn-clear {
      background: #2a2a4a;
      color: #eaeaea;
    }
    .btn-update {
      background: #2a2a4a;
      color: #4ecca3;
      font-size: 14px;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
    }
    .result {
      margin-top: 20px;
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      border-left: 4px solid #4ecca3;
      display: none;
    }
    .result.show { display: block; }
    .result.error { border-left-color: #ff6b6b; }
    .result.warning { border-left-color: #ffa500; }
    .result h2 {
      font-size: 16px;
      color: #4ecca3;
      margin-bottom: 12px;
    }
    .result.error h2 { color: #ff6b6b; }
    .result.warning h2 { color: #ffa500; }
    .field {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a4a;
    }
    .field:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .field-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .field-value {
      font-size: 15px;
      color: #eaeaea;
      line-height: 1.4;
    }
    .field-value.highlight {
      color: #4ecca3;
      font-weight: 600;
    }
    .probable {
      background: #1e3a2f;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .probable .label {
      font-size: 11px;
      color: #4ecca3;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .probable .text {
      font-size: 15px;
      color: #fff;
      line-height: 1.5;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 20px;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 Panic Analyzer</h1>
    <div class="version" id="version">База: загрузка...</div>
    <div class="status" id="status">Онлайн</div>
  </div>

  <textarea id="input" placeholder="Вставь сюда текст panic-лога..."></textarea>

  <div class="btn-row">
    <button class="btn-analyze" onclick="analyze()">Анализировать</button>
    <button class="btn-clear" onclick="clearAll()">Очистить</button>
  </div>

  <button class="btn-update" onclick="updateDatabase()">🔄 Обновить базу</button>

  <div class="result" id="result"></div>

  <div class="footer">
    Panic Analyzer v4.0 · Работает офлайн
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
